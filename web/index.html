<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="referrer" content="no-referrer">
    <meta name="description" content="BlinkGuard: a PDF reader that rings an alarm when your eyes close. Runs entirely in your browser.">
    <title>BlinkGuard</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="./src/style.css">
  </head>
  <body>
    <a class="skip-link" href="#reader" data-i18n="pdf.title">PDF reader</a>

    <header class="topbar">
      <div class="brand">
        <svg class="logo" viewBox="0 0 32 32" aria-hidden="true">
          <path d="M2 16s5-9 14-9 14 9 14 9-5 9-14 9S2 16 2 16z" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"/>
          <circle cx="16" cy="16" r="4.5" fill="currentColor"/>
        </svg>
        <span class="brand-name">BlinkGuard</span>
        <span class="tagline" data-i18n="app.tagline">Stay awake while you read</span>
      </div>
      <div class="top-actions">
        <button type="button" id="privacy-link" class="btn ghost" data-i18n="nav.privacy">Privacy</button>
        <div class="lang-switch" role="group" data-i18n-label="lang.label">
          <button type="button" data-lang="en" lang="en" aria-pressed="true">EN</button>
          <button type="button" data-lang="fr" lang="fr" aria-pressed="false">FR</button>
        </div>
      </div>
    </header>

    <div id="alarm-banner" class="alarm-banner" role="alert" hidden></div>

    <main class="layout">
      <aside class="side">
        <section class="card" aria-labelledby="cam-title">
          <h2 id="cam-title" data-i18n="cam.title">Eye tracking</h2>
          <div class="video-wrap" role="img" data-i18n-label="cam.videoLabel">
            <video id="video" playsinline muted></video>
            <canvas id="overlay"></canvas>
            <div id="cam-placeholder" class="cam-placeholder">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7h4l2-2h6l2 2h4v12H3z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><circle cx="12" cy="13" r="3.5" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>
              <span id="cam-placeholder-text" data-i18n="cam.off">Camera off</span>
            </div>
          </div>
          <p class="state-row"><span id="state-pill" class="pill" data-state="inactive" aria-live="polite"></span></p>
          <button type="button" id="toggle-tracking" class="btn primary wide"></button>
          <p id="cam-error" class="error" role="alert" hidden></p>
          <dl class="metrics">
            <div><dt data-i18n="metric.ear"></dt><dd id="m-ear">–</dd></div>
            <div><dt data-i18n="metric.blinks"></dt><dd id="m-blinks">0</dd></div>
            <div><dt data-i18n="metric.closedFor"></dt><dd id="m-closed">0.0 s</dd></div>
            <div><dt data-i18n="metric.alerts"></dt><dd id="m-alerts">0</dd></div>
            <div><dt data-i18n="metric.intensity"></dt><dd id="m-intensity">100%</dd></div>
            <div><dt data-i18n="metric.cooldown"></dt><dd id="m-cooldown">–</dd></div>
          </dl>
          <div class="row">
            <button type="button" id="test-sound" class="btn" data-i18n="alarm.testSound">Test sound</button>
            <button type="button" id="mute" class="btn" aria-pressed="false"></button>
          </div>
          <p id="audio-warning" class="warning" hidden data-i18n="alarm.audioBlocked"></p>
        </section>

        <section class="card" aria-labelledby="stats-title">
          <h2 id="stats-title" data-i18n="stats.title">This session</h2>
          <dl class="metrics">
            <div><dt data-i18n="stats.duration"></dt><dd id="s-duration">0:00</dd></div>
            <div><dt data-i18n="stats.pages"></dt><dd id="s-pages">0</dd></div>
            <div><dt data-i18n="stats.speed"></dt><dd id="s-speed">0</dd></div>
            <div><dt data-i18n="stats.blinkRate"></dt><dd id="s-blink-rate">0</dd></div>
            <div><dt data-i18n="stats.alerts"></dt><dd id="s-alerts">0</dd></div>
          </dl>
          <div class="row">
            <button type="button" id="export-csv" class="btn" data-i18n="stats.exportCsv"></button>
            <button type="button" id="export-json" class="btn" data-i18n="stats.exportJson"></button>
            <button type="button" id="reset-stats" class="btn ghost" data-i18n="stats.reset"></button>
          </div>
        </section>

        <section class="card shortcuts" aria-labelledby="shortcuts-title">
          <h2 id="shortcuts-title" data-i18n="shortcuts.title">Keyboard shortcuts</h2>
          <ul>
            <li data-i18n="shortcuts.pages"></li>
            <li data-i18n="shortcuts.zoom"></li>
            <li data-i18n="shortcuts.open"></li>
          </ul>
        </section>
      </aside>

      <section id="reader" class="card reader" aria-labelledby="pdf-title" tabindex="-1">
        <div class="toolbar">
          <h2 id="pdf-title" class="toolbar-title" data-i18n="pdf.title">PDF reader</h2>
          <button type="button" id="open-pdf" class="btn primary" data-i18n="pdf.open">Open PDF</button>
          <input type="file" id="file-input" accept="application/pdf,.pdf" hidden>
          <div class="pager">
            <button type="button" id="prev-page" class="btn icon" data-i18n-label="pdf.prev" data-i18n-title="pdf.prev" disabled>‹</button>
            <span id="page-label" class="page-label" aria-live="polite"></span>
            <button type="button" id="next-page" class="btn icon" data-i18n-label="pdf.next" data-i18n-title="pdf.next" disabled>›</button>
          </div>
          <div class="zoom">
            <button type="button" id="zoom-out" class="btn icon" data-i18n-label="pdf.zoomOut" data-i18n-title="pdf.zoomOut" disabled>−</button>
            <span id="zoom-label" class="zoom-label"></span>
            <button type="button" id="zoom-in" class="btn icon" data-i18n-label="pdf.zoomIn" data-i18n-title="pdf.zoomIn" disabled>+</button>
          </div>
        </div>
        <div id="pdf-stage" class="stage">
          <div id="pdf-empty" class="empty">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h8l4 4v14H6z M14 3v4h4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>
            <p class="empty-title" data-i18n="pdf.empty">Open a PDF or drop it here</p>
            <p class="empty-hint" data-i18n="pdf.emptyHint">The file stays on your device.</p>
          </div>
          <p id="pdf-error" class="error" role="alert" hidden></p>
          <canvas id="pdf-canvas" hidden></canvas>
        </div>
      </section>
    </main>

    <footer class="footer"><p data-i18n="footer.disclaimer"></p></footer>

    <dialog id="privacy-dialog" aria-labelledby="privacy-title">
      <h2 id="privacy-title" data-i18n="privacy.title">Before we turn on your camera</h2>
      <ul class="privacy-list">
        <li data-i18n="privacy.local"></li>
        <li data-i18n="privacy.noData"></li>
        <li data-i18n="privacy.stop"></li>
        <li class="important" data-i18n="privacy.notMedical"></li>
      </ul>
      <div class="dialog-actions">
        <button type="button" id="privacy-cancel" class="btn" data-i18n="privacy.cancel">Cancel</button>
        <button type="button" id="privacy-accept" class="btn primary" data-i18n="privacy.accept">Turn on camera</button>
      </div>
    </dialog>

    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
